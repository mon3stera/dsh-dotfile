# dsh-magic-context bundle layer.
#
# The bare host shell mounts settings and startup guidance once per profile. Its
# exact package name also lets dsh-client-modules discover the browser half at
# Web boot. ContextEngine remains on the explicit /engine entry inside the
# isolated context-compact compaction realm.
- insert:
    - id: dsh-magic-context
      name: dsh-magic-context
      config:
        host: true
