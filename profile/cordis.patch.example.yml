# Example loader patch for the DSH web profile.
# Copy the insert entries below into ~/.dsh/profiles/web/cordis.patch.yml
# (or your profile's cordis.patch.yml). Install dsh-magic-context as a profile
# bundle; its bundle patch supplies the host settings bridge. A process restart
# picks the composed layers up.
- insert:
    - id: dsh-plugin-background
      name: dsh-plugin-background
    - id: dsh-plugin-logo
      name: dsh-plugin-logo
    - id: dsh-plugin-font
      name: dsh-plugin-font
    - id: dsh-plugin-hide-session-titles
      name: dsh-plugin-hide-session-titles
    # The dsh-magic-context bundle supplies its `host: true` bare host shell.
    # That exact package-name row makes the browser half exist at Web boot;
    # the agent preset mounts dsh-magic-context/engine separately.
    - id: dsh-plugin-outline
      name: dsh-plugin-outline
    - id: dsh-plugin-diff-viewer
      name: dsh-plugin-diff-viewer
    - id: dsh-plugin-session-id
      name: dsh-plugin-session-id
    # Image-generation endpoints as selectable models. Each declared model
    # appears in the model selector under its provider id; selecting one turns
    # the session into a generate-only route, because the adapter emits no tool
    # call and the agent loop therefore runs a single step. `edits: true` refines
    # the newest image already in the session rather than generating from
    # scratch, which is what a follow-up like "make it bluer" needs. Only the
    # options declared per model are sent, since gateways reject parameters they
    # do not recognize.
    #
    # This block is only a seed. The "Image models" settings section edits
    # $DSH_HOME/image-model/config.json, which wins per provider id and applies
    # without a restart, so the panel is the normal way to manage these. A
    # provider deleted in the panel stays deleted even while it is seeded here.
    # `apiKeyRef` names a credential the host store resolves - an environment
    # variable of that name, or a key saved in the panel.
    - id: dsh-plugin-image-model
      name: dsh-plugin-image-model
      config:
        providers:
          - id: torchai-image
            name: TorchAI Image
            baseURL: https://torchai.ai/v1
            apiKeyRef: OPENAI_API_KEY
            edits: true
            models:
              - id: gpt-image-1
                name: GPT Image 1
                size: '1024x1024'
    # Context7 documentation lookup over Streamable HTTP. Set CONTEXT7_API_KEY
    # in the DSH service environment for authenticated/higher-rate access.
    - id: mcp-context7
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: context7
        transport: streamable-http
        url: https://mcp.context7.com/mcp
    # Example: rewrite User-Agent for a gateway that only accepts claude-cli.
    - id: dsh-header-rewrite
      name: dsh-header-rewrite
      config:
        rules:
          - match:
              host: agentrouter.org
              path: /v1/messages
            headers:
              User-Agent: claude-cli/1.0.0 (external, cli)

# Make Context Compact the default for newly created Web sessions.
- id: agent-presets
  config:
    default: context-compact

# Pin the browse directory picker (needed for remote/tunneled access).
#
# `directory-picker` is the adaptive chooser: at boot it samples the bind host,
# SSH env, platform, DISPLAY/WAYLAND_DISPLAY, and whether zenity/kdialog is on
# PATH, then mounts either the native or the browse pair. A loopback bind plus a
# live display plus no SSH_CONNECTION reads as "the operator can see this host's
# desktop" — which is wrong when the browser arrives through an SSH tunnel. The
# native dialog then opens on a desktop nobody is watching and
# `host.pickDirectory` never settles; `host.listDirectory` meanwhile refuses
# with `directory-picker-unavailable` because the composed picker serves
# "native". Pinning browse keeps directory selection inside the browser.
#
# `name` on an id-targeted patch row is an assertion, not a rename (a mismatch
# skips the row), so the auto row is disabled and the browse pair is inserted.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
    - id: directory-picker-browse-ui
      name: '@deepseek-ai/dsh-client-ui-directory-picker-browse'
